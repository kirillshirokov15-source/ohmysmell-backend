name: Tilda OWN X Warehouse Policy
on:
  push:
    branches:
      - feature/tilda-own-x-only-20261014
  workflow_dispatch:
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest aiosqlite
      - name: Compile project
        run: python -m compileall -q app tests
      - name: Tilda warehouse policy plus manager source navigation
        env:
          EXTERNAL_WRITES_ENABLED: 'false'
          SUPPLIER_EMAIL_SEND_ENABLED: 'false'
          TELEGRAM_BOT_TOKEN: '123456:TEST_CI_TOKEN_NO_NETWORK'
        run: |
          python -m pytest -q tests/test_tilda_own_x_only_policy.py tests/test_source_navigation_ui.py tests/test_owned_x_enter_and_fast_chat.py
