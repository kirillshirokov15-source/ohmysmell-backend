name: Gmail counterparty card navigation
on:
  push:
    branches: [hotfix/gmail-counterparty-review-card-20261025]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  counterparty-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: staging
      EXTERNAL_WRITES_ENABLED: 'false'
      SUPPLIER_EMAIL_SEND_ENABLED: 'false'
      TELEGRAM_BOT_TOKEN: '123456:TEST_NO_NETWORK'
      CLIENT_TELEGRAM_BOT_TOKEN: '123456:TEST_NO_NETWORK'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest aiosqlite
      - run: python -m compileall -q app/services/draft_telegram_service.py app/bot/telegram_bot.py app/bot/manager_inputs.py
      - name: Gmail counterparty interactive review and regression
        run: |
          python -m pytest -q \
            tests/test_gmail_counterparty_review_card.py \
            tests/test_manager_guided_counterparty.py \
            tests/test_manager_email_orders_navigation.py \
            tests/test_wholesale_counterparty_acceptance.py \
            tests/test_unified_gmail_tilda_workflow.py \
            tests/test_wholesale_real_email_samples.py
