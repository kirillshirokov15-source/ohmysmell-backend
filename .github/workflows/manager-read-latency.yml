name: Manager Bot Read Performance Acceptance
on:
  push:
    branches: [release/manager-read-latency-20261016]
  workflow_dispatch:
jobs:
  manager:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest aiosqlite
      - run: python -m compileall -q app tests
      - name: Verify fast read models and original warehouse workflows
        env:
          APP_ENV: staging
          EXTERNAL_WRITES_ENABLED: 'false'
          TELEGRAM_BOT_TOKEN: '123456:TEST_CI_TOKEN_NO_NETWORK'
        run: >-
          python -m pytest -q -m "not staging"
          tests/test_manager_ledger_read_performance.py
          tests/test_source_navigation_ui.py
          tests/test_hatuna_accounting.py
          tests/test_hatuna_document_runner.py
          tests/test_hatuna_full_flow.py
          tests/test_gmail_real_order_samples.py
          tests/test_wholesale_real_email_samples.py
          tests/test_real_wholesale_mail_formats.py
          tests/test_email_pipeline.py
          tests/test_gmail_acceptance.py
          tests/test_manager_cp_action_feedback.py
          tests/test_buying.py
          tests/test_buying_roles.py
          tests/test_tilda_orders.py
