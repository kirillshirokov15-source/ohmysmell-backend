name: Final demo email and X warehouse validation
on:
  push:
    branches:
      - feature/full-x-buying-demo-20261014
  workflow_dispatch:
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest aiosqlite
      - run: python -m compileall -q app tests
      - name: Email real samples plus warehouse accounting and Buying
        env:
          APP_ENV: staging
          EXTERNAL_WRITES_ENABLED: 'false'
          TELEGRAM_BOT_TOKEN: '123456:TEST_CI_TOKEN_NO_NETWORK'
        run: python -m pytest -q tests/test_gmail_real_order_samples.py tests/test_email_pipeline.py tests/test_gmail_acceptance.py tests/test_hatuna_accounting.py tests/test_hatuna_document_runner.py tests/test_hatuna_full_flow.py tests/test_order_sources.py tests/test_source_navigation_ui.py tests/test_buying.py tests/test_buying_roles.py tests/test_manager_cp_action_feedback.py
