name: Customer Gmail session recovery
on:
  push:
    branches:
      - fix/customer-gmail-session-recovery-20261024
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest aiosqlite
      - name: Compile
        run: python -m compileall -q app tests
      - name: Verify customer Gmail auth handling and regression suite
        env:
          APP_ENV: staging
          EXTERNAL_WRITES_ENABLED: 'false'
          TELEGRAM_BOT_TOKEN: '123456:TEST_CI_TOKEN_NO_NETWORK'
        run: python -m pytest -q tests/test_email_worker_recovery.py tests/test_gmail_auth.py tests/test_customer_gmail_readonly_smoke.py tests/test_gmail_mailboxes.py tests/test_email_pipeline.py tests/test_gmail_acceptance.py tests/test_gmail_real_order_samples.py tests/test_gmail_bare_subject_order.py
