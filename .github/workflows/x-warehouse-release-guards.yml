name: OhMySmell X warehouse release guards
on:
  push:
    branches:
      - test/x-warehouse-release-guards-20261025
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-x-warehouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: staging
      EXTERNAL_WRITES_ENABLED: 'false'
      OMS_OWN_X_LIVE_ENABLED: 'false'
      OMS_HATUNA_AUTO_PROCESS_ENABLED: 'false'
      OMS_HATUNA_AUTO_WRITES_ENABLED: 'false'
      SUPPLIER_EMAIL_SEND_ENABLED: 'false'
      ORDER_DESK_SEND_ENABLED: 'false'
      TELEGRAM_BOT_TOKEN: '123456:TEST_NO_NETWORK'
      CLIENT_TELEGRAM_BOT_TOKEN: '123456:TEST_NO_NETWORK'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install offline test dependencies
        run: python -m pip install -r requirements.txt pytest aiosqlite
      - name: Compile X warehouse code
        run: |
          python -m compileall -q app/services/hatuna_accounting.py app/services/hatuna_fulfillment.py app/services/hatuna_document_runner.py app/services/warehouse_documents.py app/workers/hatuna_auto.py
      - name: X warehouse, idempotency and business rule regression without external writes
        run: |
          python -m pytest -q \
            tests/test_hatuna_accounting.py \
            tests/test_hatuna_document_runner.py \
            tests/test_hatuna_full_flow.py \
            tests/test_hatuna_order8_post_pick_scope.py \
            tests/test_hatuna_postpick_followup_buttons.py \
            tests/test_hatuna_readonly_check.py \
            tests/test_x_partner_guided_receipt.py
