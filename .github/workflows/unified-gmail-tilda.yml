name: Unified Gmail and Tilda without wholesale delivery
on:
  push:
    branches: [release/unified-gmail-tilda-no-delivery-20261025]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unified-fulfillment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: staging
      EXTERNAL_WRITES_ENABLED: 'false'
      OMS_HATUNA_AUTO_PROCESS_ENABLED: 'false'
      SUPPLIER_EMAIL_SEND_ENABLED: 'false'
      TELEGRAM_BOT_TOKEN: '123456:TEST_NO_NETWORK'
      CLIENT_TELEGRAM_BOT_TOKEN: '123456:TEST_NO_NETWORK'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest aiosqlite
      - run: python -m compileall -q app/services app/bot app/workers app/repositories
      - name: Gmail/Tilda unified orders and existing warehouse regressions
        run: |
          python -m pytest -q \
            tests/test_unified_gmail_tilda_workflow.py \
            tests/test_payment_first_manager_ui.py \
            tests/test_tilda_sku_review.py \
            tests/test_own_stock_reservation_hotfix.py \
            tests/test_manager_order_full_card.py \
            tests/test_manager_order8_postpick_card.py \
            tests/test_wholesale_counterparty_acceptance.py \
            tests/test_gmail_wholesale_manager_card_evidence.py \
            tests/test_wholesale_real_email_samples.py \
            tests/test_hatuna_full_flow.py
