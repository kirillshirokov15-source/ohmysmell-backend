name: Gmail paid-last manager UI
on:
  push:
    branches: [hotfix/email-paid-last-manager-ui-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  payment-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: staging
      EXTERNAL_WRITES_ENABLED: 'false'
      SUPPLIER_EMAIL_SEND_ENABLED: 'false'
      TELEGRAM_BOT_TOKEN: '123456:TEST_NO_NETWORK'
      CLIENT_TELEGRAM_BOT_TOKEN: '123456:TEST_NO_NETWORK'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest aiosqlite
      - run: python -m compileall -q app/services/manager_workspace.py
      - name: Payment-priority Gmail/Tilda and CRM workflow regression
        run: |
          python -m pytest -q \
            tests/test_gmail_payment_last_manager_ui.py \
            tests/test_payment_first_manager_ui.py \
            tests/test_unified_gmail_tilda_workflow.py \
            tests/test_manager_order_full_card.py \
            tests/test_manager_order8_postpick_card.py \
            tests/test_manager_email_orders_navigation.py \
            tests/test_own_stock_reservation_hotfix.py
