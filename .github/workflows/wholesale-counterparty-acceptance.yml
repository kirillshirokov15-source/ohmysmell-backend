name: Wholesale Counterparty Acceptance
on:
  push:
    branches:
      - feature/gmail-counterparty-acceptance-20261014
  workflow_dispatch:
jobs:
  counterparties:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest aiosqlite
      - run: python -m compileall -q app tests
      - name: Counterparties + Gmail order and manager bot regressions
        env:
          APP_ENV: staging
          EXTERNAL_WRITES_ENABLED: 'false'
          TELEGRAM_BOT_TOKEN: '123456:TEST_CI_TOKEN_NO_NETWORK'
        run: python -m pytest -q tests/test_wholesale_counterparty_acceptance.py tests/test_email_pipeline.py tests/test_email_intent_safety.py tests/test_gmail_bare_subject_order.py tests/test_gmail_subject_reconsider_existing.py tests/test_email_inquiry_read_button.py tests/test_manager_email_orders_navigation.py tests/test_gmail_acceptance.py tests/test_telegram_menu_regressions.py
