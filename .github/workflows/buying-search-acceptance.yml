name: Buying Catalog Search Acceptance
on:
  push:
    branches:
      - feature/buying-search-prefix-negation-20261015
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest aiosqlite
      - run: python -m compileall -q app tests
      - name: Checkout link browser smoke test (no real orders)
        run: node tests/tilda_checkout_link_smoke.cjs
      - name: Buying search and existing catalog and permissions
        env:
          APP_ENV: staging
          EXTERNAL_WRITES_ENABLED: 'false'
          TELEGRAM_BOT_TOKEN: '123456:TEST_CI_TOKEN_NO_NETWORK'
        run: python -m pytest -q tests/test_buying_catalog_search.py tests/test_buying.py tests/test_buying_roles.py
