name: Final Email Tables & Hatuna X Demo
on:
  push:
    branches:
      - feature/full-x-buying-demo-20261014
  workflow_dispatch:
jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: oms_test
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest aiosqlite psycopg2-binary asyncpg
      - run: python -m compileall -q app tests scripts
      - name: Gmail formats, counterparts, source accounting, Buying regressions
        env:
          APP_ENV: staging
          EXTERNAL_WRITES_ENABLED: 'false'
          TELEGRAM_BOT_TOKEN: '123456:TEST_CI_TOKEN_NO_NETWORK'
          TEST_POSTGRES_URL: postgresql+asyncpg://postgres:test@localhost:5432/oms_test
        run: python -m pytest -q tests/test_real_wholesale_mail_formats.py tests/test_hatuna_accounting.py tests/test_hatuna_order_readonly_preflight.py tests/test_hatuna_document_runner.py tests/test_hatuna_full_flow.py tests/test_wholesale_counterparty_acceptance.py tests/test_manager_cp_action_feedback.py tests/test_gmail_acceptance.py tests/test_email_pipeline.py tests/test_email_intent_safety.py tests/test_gmail_bare_subject_order.py tests/test_gmail_subject_reconsider_existing.py tests/test_email_inquiry_read_button.py tests/test_buying.py tests/test_buying_roles.py tests/test_order_desk_hardening.py
