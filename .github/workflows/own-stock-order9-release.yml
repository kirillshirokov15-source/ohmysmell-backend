name: Production own-stock reservation UX
on:
  push:
    branches: [hotfix/own-stock-reservation-order9-ui-20261025]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  own-stock-order9:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: staging
      EXTERNAL_WRITES_ENABLED: 'false'
      TELEGRAM_BOT_TOKEN: '123456:TEST_NO_NETWORK'
      CLIENT_TELEGRAM_BOT_TOKEN: '123456:TEST_NO_NETWORK'
      SUPPLIER_EMAIL_SEND_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest aiosqlite
      - run: python -m compileall -q app/bot/telegram_bot.py app/bot/source_navigation.py app/services/own_stock_reservation.py app/services/manager_workspace.py app/services/order_operations.py app/services/desk_display.py
      - name: Order 9 reservation and Telegram screens
        run: |
          python -m pytest -q \
            tests/test_own_stock_reservation_hotfix.py \
            tests/test_manager_order_full_card.py \
            tests/test_source_navigation_ui.py \
            tests/test_order_sources.py \
            tests/test_manager_order8_postpick_card.py \
            tests/test_order_desk_hardening.py
