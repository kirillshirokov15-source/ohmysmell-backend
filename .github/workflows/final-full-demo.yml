name: Full X and Email Samples Demo
on:
  push:
    branches:
      - feature/full-x-buying-demo-20261014
  workflow_dispatch:
jobs:
  safe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest aiosqlite
      - run: python -m compileall -q app tests
      - name: Actual customer email examples, X stock accounting, supplier workflow
        env:
          APP_ENV: staging
          EXTERNAL_WRITES_ENABLED: 'false'
          TELEGRAM_BOT_TOKEN: '123456:TEST_CI_TOKEN_NO_NETWORK'
        run: python -m pytest -q tests/test_wholesale_real_email_samples.py tests/test_hatuna_accounting.py tests/test_hatuna_document_runner.py tests/test_hatuna_full_flow.py tests/test_buying.py tests/test_buying_roles.py tests/test_gmail_mailboxes.py tests/test_email_pipeline.py tests/test_email_intent_safety.py tests/test_gmail_acceptance.py tests/test_wholesale_counterparty_acceptance.py
