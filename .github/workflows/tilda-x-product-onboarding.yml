name: Tilda missing X product onboarding
on:
  push:
    branches: [hotfix/tilda-own-x-missing-product-20261025]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-x-product:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: staging
      EXTERNAL_WRITES_ENABLED: 'false'
      OMS_OWN_X_PRODUCT_CREATE_ENABLED: 'false'
      TELEGRAM_BOT_TOKEN: '123456:TEST_NO_NETWORK'
      CLIENT_TELEGRAM_BOT_TOKEN: '123456:TEST_NO_NETWORK'
      SUPPLIER_EMAIL_SEND_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest aiosqlite
      - run: python -m compileall -q app/services/tilda_x_product_service.py app/bot/order_desk.py app/integrations/moysklad/client.py
      - name: Missing X product and Tilda two-line order regressions
        run: |
          python -m pytest -q \
            tests/test_tilda_x_missing_product.py \
            tests/test_tilda_sku_review.py \
            tests/test_hatuna_accounting.py \
            tests/test_hatuna_document_runner.py \
            tests/test_own_x_live_gates.py \
            tests/test_manager_order_full_card.py
