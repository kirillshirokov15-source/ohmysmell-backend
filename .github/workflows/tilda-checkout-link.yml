name: Tilda Checkout Link Safety
on:
  push:
    branches:
      - feature/tilda-telegram-checkout-link-20261014
  workflow_dispatch:

jobs:
  checkout-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - name: Verify Python imports and JavaScript syntax
        run: |
          python -m compileall -q app tests
          node --check app/static/tilda_checkout_link.js
      - name: Tilda webhook and checkout link tests (no database or external writes)
        env:
          EXTERNAL_WRITES_ENABLED: 'false'
          OMS_STAGING_TESTS: '0'
        run: |
          python -m pytest -q -m "not staging" tests/test_tilda_orders.py tests/test_tilda_checkout_link.py
