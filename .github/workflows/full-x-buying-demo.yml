name: Full X and Buying Demo Acceptance
on:
  push:
    branches:
      - feature/full-x-buying-demo-20261014
  workflow_dispatch:
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ohmysmell
          POSTGRES_PASSWORD: staging_fake
          POSTGRES_DB: ohmysmell_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ohmysmell"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest aiosqlite psycopg2-binary
      - run: python -m compileall -q app tests scripts
      - name: X receipt, assembly, invoices, Buying fake supplier and Gmail
        env:
          APP_ENV: staging
          EXTERNAL_WRITES_ENABLED: 'false'
          OMS_HATUNA_POST_PICK_ENABLED: 'true'
          OMS_HATUNA_AUTO_WRITES_ENABLED: 'false'
          OMS_HATUNA_AUTO_PROCESS_ENABLED: 'false'
          TELEGRAM_BOT_TOKEN: '123456:TEST_CI_TOKEN_NO_NETWORK'
          TEST_DATABASE_URL: postgresql+asyncpg://ohmysmell:staging_fake@localhost:5432/ohmysmell_test
        run: python -m pytest -q tests/test_hatuna_accounting.py tests/test_hatuna_document_runner.py tests/test_hatuna_full_flow.py tests/test_buying.py tests/test_buying_roles.py tests/test_gmail_mailboxes.py tests/test_manager_cp_action_feedback.py tests/test_wholesale_counterparty_acceptance.py tests/test_email_pipeline.py
